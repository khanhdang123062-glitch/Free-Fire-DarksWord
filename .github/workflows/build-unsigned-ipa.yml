name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install ldid
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install ldid

      - name: List all projects
        run: |
          echo "=== List all .xcodeproj ==="
          find . -name "*.xcodeproj" -type d
          echo "=== List all targets ==="
          for proj in $(find . -name "*.xcodeproj" -type d); do
            echo "--- $proj ---"
            xcodebuild -list -project "$proj" 2>/dev/null || echo "Failed to list $proj"
          done

      - name: Build .app
        run: |
          PROJ=$(find . -name "*.xcodeproj" -type d | head -n 1)
          SCHEME=$(xcodebuild -list -project "$PROJ" 2>/dev/null | grep -A1 "Schemes:" | tail -n1 | sed 's/^[[:space:]]*//')
          if [ -z "$SCHEME" ]; then
            echo "No scheme found, trying to build all targets"
            xcodebuild build \
              -project "$PROJ" \
              -alltargets \
              -configuration Release \
              -sdk iphoneos \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              OTHER_CFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-incompatible-pointer-types"
          else
            echo "Building scheme: $SCHEME"
            xcodebuild build \
              -project "$PROJ" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              OTHER_CFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-incompatible-pointer-types"
          fi

      - name: Find .app
        id: find_app
        run: |
          APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found, looking for .dylib..."
            DYLIB_PATH=$(find . -name "*.dylib" -type f | head -n 1)
            if [ -n "$DYLIB_PATH" ]; then
              echo "Found .dylib at: $DYLIB_PATH"
              mkdir -p Payload
              cp "$DYLIB_PATH" Payload/
              zip -r darksword-unsigned.ipa Payload/
              echo "IPA created from dylib"
              exit 0
            fi
            echo "No .app or .dylib found!"
            find . -name "*.app" -o -name "*.dylib" -o -name "*.ipa"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          echo "Found app at: $APP_PATH"

      - name: Package IPA
        if: env.APP_PATH != ''
        run: |
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r darksword-unsigned.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: darksword-unsigned
          path: darksword-unsigned.ipa
