name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    runs-on: macos-14
    timeout-minutes: 30
    concurrency:
      group: unsigned-ipa-release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install build dependency
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install ldid

      - name: Set release version
        id: version
        run: |
          marketing_version="$(xcodebuild -showBuildSettings \
            -project darksword-kexploit-fun.xcodeproj \
            -scheme darksword-kexploit-fun \
            -configuration Release | awk '/ MARKETING_VERSION = / { print $3; exit }')"
          test -n "$marketing_version"
          echo "marketing_version=$marketing_version" >> "$GITHUB_OUTPUT"
          echo "tag=v${marketing_version}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build without Apple code signing
        run: |
          xcodebuild build \
            -project darksword-kexploit-fun.xcodeproj \
            -scheme darksword-kexploit-fun \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build/Products" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          app_path="$GITHUB_WORKSPACE/build/Products/Release-iphoneos/kfun.app"
          staging_path="$RUNNER_TEMP/ipa-staging"
          ipa_path="$GITHUB_WORKSPACE/build/Free Fire DS.ipa"

          test -d "$app_path"
          mkdir -p "$staging_path/Payload"
          ditto "$app_path" "$staging_path/Payload/kfun.app"
          (
            cd "$staging_path"
            ditto -c -k --sequesterRsrc --keepParent Payload "$ipa_path"
          )

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Free-Fire-DS-IPA-${{ steps.version.outputs.tag }}
          path: build/Free Fire DS.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "build/Free Fire DS.ipa" --clobber
          else
            gh release create "$TAG" "build/Free Fire DS.ipa" \
              --title "Free Fire DS v${MARKETING_VERSION} (${GITHUB_RUN_NUMBER})" \
              --generate-notes
          fi
