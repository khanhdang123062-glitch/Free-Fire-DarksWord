name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install dependencies
        run: |
          brew install ldid
          brew install make

      - name: Build XPF (libxpf.dylib)
        run: |
          cd darksword-kexploit-fun/XPF
          make all || echo "XPF build skipped"

      - name: Build with make
        id: build
        run: |
          echo "=== BUILD LOG START ==="
          cd darksword-kexploit-fun
          make 2>&1 | tee build.log
          echo "=== BUILD LOG END ==="
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "BUILD_FAILED=true" >> $GITHUB_ENV
          fi
          cp build.log ../build.log || true

      - name: Try xcodebuild if make fails
        if: env.BUILD_FAILED == 'true'
        run: |
          echo "=== XCODEBUILD LOG START ==="
          xcodebuild -project darksword-kexploit-fun.xcodeproj -alltargets -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee xcodebuild.log
          echo "=== XCODEBUILD LOG END ==="
          cp xcodebuild.log ../xcodebuild.log || true

      - name: Find .app
        id: find_app
        run: |
          APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
            echo "Found app at: $APP_PATH"
          else
            echo "No .app found"
          fi

      - name: Package IPA
        if: env.APP_PATH != ''
        run: |
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r darksword-unsigned.ipa Payload/

      - name: Collect logs for debug
        if: env.APP_PATH == ''
        run: |
          mkdir -p debug_output
          find . -name "*.log" -o -name "*.txt" -o -name "*.xcresult" | while read f; do
            cp "$f" debug_output/ 2>/dev/null || true
          done
          cd darksword-kexploit-fun
          find . -name "*.o" -o -name "*.d" | head -50 > ../debug_output/compiled_files.txt || true
          cd ..
          uname -a > debug_output/system_info.txt
          xcodebuild -version > debug_output/xcode_version.txt
          zip -r debug_archive.zip debug_output/ build.log xcodebuild.log 2>/dev/null || true

      - name: Upload IPA (if built)
        if: env.APP_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: darksword-unsigned
          path: darksword-unsigned.ipa

      - name: Upload debug archive
        if: env.APP_PATH == ''
        uses: actions/upload-artifact@v4
        with:
          name: debug_archive
          path: debug_archive.zip
