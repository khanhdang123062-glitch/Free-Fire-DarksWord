name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Fix project (if needed)
        run: |
          # Xóa các tham chiếu lỗi nếu có
          sed -i '' '/RepositoryHomeView/d' darksword-kexploit-fun.xcodeproj/project.pbxproj 2>/dev/null || true
          sed -i '' '/RepositorySourcesView/d' darksword-kexploit-fun.xcodeproj/project.pbxproj 2>/dev/null || true

      - name: Build
        run: |
          set -o pipefail
          rm -rf build
          xcodebuild archive \
            -project darksword-kexploit-fun.xcodeproj \
            -scheme darksword-kexploit-fun \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/darksword.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO \
            2>&1 | tee build.log
          echo "Build exit code: ${PIPESTATUS[0]}"
          exit ${PIPESTATUS[0]}

      - name: Upload log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package IPA
        if: success()
        run: |
          set -e
          APP=$(find build/darksword.xcarchive -name "*.app" -type d | head -1)
          echo "App found: $APP"
          test -n "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/darksword.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload darksword-unsigned.ipa
          echo "IPA created: darksword-unsigned.ipa"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: darksword-unsigned-ipa
          path: darksword-unsigned.ipa
          if-no-files-found: error

      - name: Upload Source (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darksword-source
          path: |
            darksword-kexploit-fun/
            darksword-kexploit-fun.xcodeproj/
            .github/
            Makefile
            README.md
            LICENSE
            .gitignore
          if-no-files-found: warn
