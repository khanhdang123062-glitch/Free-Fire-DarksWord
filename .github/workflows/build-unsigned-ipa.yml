name: Build unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install ldid
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install ldid

      - name: List targets (debug)
        run: |
          xcodebuild -list -project darksword-kexploit-fun.xcodeproj

      - name: Build .app (no signing)
        run: |
          xcodebuild build \
            -project darksword-kexploit-fun.xcodeproj \
            -target darksword-kexploit-fun \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            OTHER_CFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-incompatible-pointer-types" \
            GCC_PREPROCESSOR_DEFINITIONS="$(GCC_PREPROCESSOR_DEFINITIONS) _FILE_OFFSET_BITS=64"

      - name: Find .app
        id: find_app
        run: |
          APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found! Trying to locate build artifacts..."
            find . -name "*.app" -type d
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          echo "Found app at: $APP_PATH"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r darksword-unsigned.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: darksword-unsigned
          path: darksword-unsigned.ipa
