name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install dependencies
        run: |
          brew install ldid
          brew install make

      - name: Fix project (remove XPF dependency)
        run: |
          sed -i '' '/-lxpf/d' darksword-kexploit-fun.xcodeproj/project.pbxproj
          sed -i '' '/LIBRARY_SEARCH_PATHS/d' darksword-kexploit-fun.xcodeproj/project.pbxproj
          sed -i '' 's/objectVersion = 77;/objectVersion = 60;/g' darksword-kexploit-fun.xcodeproj/project.pbxproj

      - name: Build
        run: |
          set -o pipefail
          rm -rf build
          xcodebuild archive \
            -project darksword-kexploit-fun.xcodeproj \
            -scheme darksword-kexploit-fun \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            -archivePath build/darksword.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO \
            2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package IPA
        if: success()
        run: |
          set -e
          APP=$(find build/darksword.xcarchive -name "*.app" -type d | head -1)
          test -n "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/darksword.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload darksword-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: darksword-unsigned-ipa
          path: darksword-unsigned.ipa
          if-no-files-found: error
