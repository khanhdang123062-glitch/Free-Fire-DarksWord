name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install dependencies
        run: |
          brew install ldid
          brew install make

      - name: Build XPF (libxpf.dylib) for iOS
        run: |
          cd darksword-kexploit-fun/XPF
          make clean || echo "No clean"
          SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          make all ARCH=arm64 CFLAGS="-isysroot $SDKROOT -arch arm64 -miphoneos-version-min=15.0" LDFLAGS="-isysroot $SDKROOT -arch arm64 -miphoneos-version-min=15.0"
          mkdir -p output/ios
          find . -name "*.dylib" -exec cp {} output/ios/ \;
          file output/ios/*.dylib || echo "No dylib found"

      - name: Build .app (no signing)
        id: build_app
        continue-on-error: true
        run: |
          xcodebuild build \
            -project darksword-kexploit-fun.xcodeproj \
            -scheme darksword-kexploit-fun \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            OTHER_CFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-incompatible-pointer-types" \
            GCC_PREPROCESSOR_DEFINITIONS="$(GCC_PREPROCESSOR_DEFINITIONS) _FILE_OFFSET_BITS=64" \
            LIBRARY_SEARCH_PATHS="$(PWD)/darksword-kexploit-fun/XPF/output/ios" \
            2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log
        if: failure() || steps.build_app.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Find .app
        if: success() && steps.build_app.outcome == 'success'
        id: find_app
        run: |
          APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found!"
            find . -name "*.app" -o -name "*.dylib"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Package IPA
        if: success() && steps.build_app.outcome == 'success'
        run: |
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r darksword-unsigned.ipa Payload/

      - name: Upload IPA
        if: success() && steps.build_app.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: darksword-unsigned-ipa
          path: darksword-unsigned.ipa
          if-no-files-found: error
